name: Publish to Modrinth

on:
  push:
    branches:
      - main

concurrency:
  group: modrinth-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute release version
        id: version
        run: |
          base="$(awk -F= '$1 == "mod_version" { print $2 }' gradle.properties)"
          major_minor="$(echo "$base" | awk -F. '{ printf "%d.%d", $1, $2 }')"
          next="${major_minor}.${GITHUB_RUN_NUMBER}"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Publishing Loadout Manager ${next} for Minecraft 26.1.1"

      - name: Build
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }}

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew modrinth -Pmod_version=${{ steps.version.outputs.version }}
