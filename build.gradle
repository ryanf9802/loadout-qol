plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.modrinth.minotaur' version '2.9.0'
	id 'maven-publish'
}

version = providers.gradleProperty("mod_version").getOrElse(project.mod_version)
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"loadout_manager" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

def releaseJarName = "Loadout-Manager-mc${project.minecraft_version}-v${project.version}.jar"
def fallbackChangelog = {
	def sha = System.getenv("GITHUB_SHA")
	if (sha != null && sha.length() >= 7) {
		return "Automated release from commit `${sha.substring(0, 7)}`. See GitHub commit history for changes."
	}
	return "See GitHub commit history for changes."
}
def changelogForVersion = { String version ->
	def changelogFile = rootProject.file("CHANGELOG.md")
	if (!changelogFile.exists()) {
		return fallbackChangelog()
	}

	def lines = changelogFile.readLines()
	def start = lines.findIndexOf { it == "## ${version}" }
	if (start < 0) {
		return fallbackChangelog()
	}

	def section = []
	for (int index = start + 1; index < lines.size(); index++) {
		if (lines[index].startsWith("## ")) {
			break
		}
		section.add(lines[index])
	}

	def text = section.join("\n").trim()
	return text.isEmpty() ? fallbackChangelog() : text
}

jar {
	inputs.property "projectName", project.name
	archiveFileName = releaseJarName

	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = project.modrinth_project_id
	versionNumber = "${project.version}+mc${project.minecraft_version}"
	versionName = "Loadout Manager ${project.version} for Minecraft ${project.minecraft_version}"
	versionType = project.release_type
	uploadFile = layout.buildDirectory.file("libs/${releaseJarName}")
	gameVersions = [project.minecraft_version]
	loaders = ["fabric"]
	changelog = changelogForVersion(project.version.toString())

	dependencies {
		required.project("fabric-api")
		optional.project("modmenu")
	}
}

tasks.matching { it.name == "modrinth" }.configureEach {
	dependsOn "build"
}

tasks.register("printModrinthChangelog") {
	group = "publishing"
	description = "Prints the changelog section that will be uploaded for the current mod_version."
	doLast {
		println changelogForVersion(project.version.toString())
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
