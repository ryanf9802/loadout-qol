plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.modrinth.minotaur' version '2.9.0'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"loadout_manager" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

def releaseJarName = "Loadout-Manager-mc${project.minecraft_version}-v${project.mod_version}.jar"

jar {
	inputs.property "projectName", project.name
	archiveFileName = releaseJarName

	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = project.modrinth_project_id
	versionNumber = "${project.mod_version}+mc${project.minecraft_version}"
	versionName = "Loadout Manager ${project.mod_version} for Minecraft ${project.minecraft_version}"
	versionType = project.release_type
	uploadFile = layout.buildDirectory.file("libs/${releaseJarName}")
	gameVersions = [project.minecraft_version]
	loaders = ["fabric"]
	changelog = rootProject.file("CHANGELOG.md").exists() ? rootProject.file("CHANGELOG.md").text : "See GitHub commit history for changes."

	dependencies {
		required.project("fabric-api")
	}
}

tasks.matching { it.name == "modrinth" }.configureEach {
	dependsOn "build"
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
